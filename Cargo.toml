[workspace]
members = ["shared", "meter", "pricing", "factory-api", "factory-db", "sandbox", "ups-control", "devices-agent"]
resolver = "2"

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
