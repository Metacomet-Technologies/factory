{
  "node": "factory-console",
  "mode": "observe",
  "calendar": "*-*-* 06:30 America/New_York",
  "agent_allowlist": [
    {"args": "/home/agent/\\.opencode/bin/opencode serve --service"},
    {"args": "/home/agent/\\.codex/packages/app-server-daemon/releases/[^/]+/bin/codex app-server .*--managed-daemon"},
    {"args": "/home/agent/\\.codex/packages/app-server-daemon/releases/[^/]+/bin/codex app-server daemon pid-update-loop"}
  ],
  "services": ["amp-runner.service", "gdm.service", "factory-backup.timer"]
}
