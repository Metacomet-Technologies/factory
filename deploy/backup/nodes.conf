# shellcheck shell=bash disable=SC2034
# Trusted shell configuration, installed root-owned in /etc/factory-backup.
BACKUP_HOST=${BACKUP_HOST:-$(hostname -s)}
LOCAL_ROOT=${LOCAL_ROOT:-/var/backups/factory-db}
STATUS_FILE=${STATUS_FILE:-/var/lib/factory-backup/status.json}
BACKUP_USER=factory-backup
BACKUP_HOME=${BACKUP_HOME:-/var/lib/factory-backup}
# Opt-in prototype; credentials are loaded by systemd, never stored here.
R2_ENABLED=${R2_ENABLED:-0}
R2_PYTHON=${R2_PYTHON:-python3}
R2_ENDPOINT=${R2_ENDPOINT:-}
R2_BUCKET=${R2_BUCKET:-}
R2_RECIPIENT_FILE=${R2_RECIPIENT_FILE:-/etc/factory-backup/age-recipient.txt}
SSH_OPTIONS=(-o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30
    -o ServerAliveCountMax=3 -o "UserKnownHostsFile=$BACKUP_HOME/known_hosts"
    -o StrictHostKeyChecking=accept-new)
case "$BACKUP_HOST" in
    factory-gpu)
        PUBLISHED_STATUS=${PUBLISHED_STATUS-/var/lib/factory-backup-status/status.json}
        DBS=("meter:${METER_DB:-/srv/factory/meter/meter.db}" "requests:${REQUESTS_DB:-/var/lib/factory-api/requests.db}" "pricing:${PRICING_DB:-/var/lib/factory-api/pricing.db}" "ups-control:${UPS_CONTROL_DB:-/var/lib/factory-ups-control/audit.db}" "atuin:${ATUIN_DB:-/var/lib/atuin/atuin.db}")
        PEER=factory-console
        REPLICA_ROOT=${REPLICA_ROOT:-/srv/factory/backups/replica}
        PEER_REPLICA_ROOT=${PEER_REPLICA_ROOT:-/var/backups/factory-replica}
        PEER_DBS=()
        BACKUP_TIME=03:15:00
        ;;
    factory-console)
        PUBLISHED_STATUS=${PUBLISHED_STATUS-}
        DBS=()
        PEER=factory-gpu
        REPLICA_ROOT=${REPLICA_ROOT:-/var/backups/factory-replica}
        PEER_REPLICA_ROOT=${PEER_REPLICA_ROOT:-/srv/factory/backups/replica}
        PEER_DBS=(meter requests pricing ups-control atuin)
        BACKUP_TIME=03:45:00
        ;;
    *) printf 'Unsupported backup host: %s\n' "$BACKUP_HOST" >&2; exit 1 ;;
esac
