name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check (the release workflow supplies the verified tag commit)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Rust and verify the C compiler
        run: |
          cc --version
          if [[ -f rust-toolchain || -f rust-toolchain.toml ]]; then
            rustup show active-toolchain
            rustup component add rustfmt clippy
          else
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain*') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  kiosk:
    name: kiosk
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Read pinned runtime versions
        id: versions
        run: |
          node -e 'const p = require("./package.json"); console.log("node=" + p.devEngines.runtime.version); console.log("bun=" + p.devEngines.packageManager.version)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pinned Vite+ and Bun via npm
        env:
          BUN_VERSION: ${{ steps.versions.outputs.bun }}
        # https://viteplus.dev/guide/local-cli: npm CLI supports package-manager commands.
        # Install outside the checkout so bootstrapping cannot change its manifests.
        run: |
          npm install --prefix "$RUNNER_TEMP/kiosk-tools" --no-audit --no-fund vite-plus@1.1.0 "bun@$BUN_VERSION"
          echo "$RUNNER_TEMP/kiosk-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the toolchain contract (docs/environments.md)
        working-directory: .
        # The hosted image lacks the pinned Rust; provision it explicitly, since the checker is read-only.
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
          python3 -B scripts/env/test_check.py
          scripts/env/check --env ci
      - run: node --version && bun --version && vp --version
      - name: Install kiosk dependencies and select its local CLI
        run: |
          vp install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/kiosk/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp check
        env:
          OPENAPI_URL: file://${{ github.workspace }}/factory-api/openapi.json
      - run: vp test --run
      - run: vp build

  scripts:
    name: scripts
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/dispatch/.node-version
      - name: Test dispatcher and usage collector
        run: node --test scripts/dispatch scripts/usage
      - name: Test immutable release fixtures and build metadata
        run: python3 scripts/release/test-release.py
      - name: Install script check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck sqlite3 zstd rsync
      - run: cargo build --locked -p meter
      - run: bash meter/tests/installer-db.sh target/debug/meter
      - name: Check every deployment and version script
        run: |
          mapfile -d '' scripts < <(find deploy scripts -type f -name '*.sh' -print0)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck -x "${scripts[@]}"
      - run: python3 -B deploy/test_set_ollama_host.py
      - run: python3 -B deploy/backup/test-backup.py
      - run: python3 -B deploy/reboot/test-reboot.py

  sandbox:
    name: sandbox
    # 24.04's AppArmor policy blocks unprivileged network namespaces. Do not disable it.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap shellcheck
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain*') }}
      - name: Check sandbox scripts
        run: |
          scripts=(scripts/sandbox scripts/sandbox-shims/nvidia-smi scripts/sandbox-shims/tailscale scripts/sandbox-shims/timedatectl scripts/sandbox-shims/ping)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck -x "${scripts[@]}"
      - run: scripts/sandbox up --rows 1k
      - name: Check pricing refresh, confirmation and positive spend avoided
        run: python3 scripts/sandbox-shims/smoke.py
      - name: Sandbox logs
        if: failure()
        run: |
          for service in runtime seed meter factory-api; do scripts/sandbox logs "$service" || true; done
      - name: Stop sandbox
        if: always()
        run: scripts/sandbox down
