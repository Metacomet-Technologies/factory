name: CI

on:
  pull_request:
  push:
    branches: [main]
  # dependabot-merge.yml dispatches CI after merging with GITHUB_TOKEN, which triggers no push run.
  workflow_dispatch:

permissions:
  contents: read

# Each main commit keeps its own run, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name != 'pull_request' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Rust and verify the C compiler
        run: |
          cc --version
          if [[ -f rust-toolchain || -f rust-toolchain.toml ]]; then
            rustup show active-toolchain
            rustup component add rustfmt clippy
          else
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-
      - name: Install cargo-nextest
        run: |
          version=0.9.149
          archive="cargo-nextest-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${version}/${archive}"
          echo "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770  $archive" | sha256sum -c
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-nextest
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-nextest" --version
      - name: Install installer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sqlite3
      - run: scripts/check --all rust

  kiosk:
    name: kiosk
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Converge to the toolchain contract (docs/environments.md)
        working-directory: .
        # Installs Rust, Vite+, Node and Bun from the repo pins, puts them on PATH, then runs scripts/env/check.
        run: scripts/env/setup.sh --ci
      - run: node --version && bun --version && vp --version
      - name: Install kiosk dependencies and select its local CLI
        run: |
          vp install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/kiosk/node_modules/.bin" >> "$GITHUB_PATH"
      - run: scripts/check --all kiosk
        working-directory: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('kiosk/bun.lock') }}
      - name: Install Playwright Chromium for the UI journeys
        run: vp exec playwright install --with-deps --only-shell chromium
      - name: Drive every verify-kiosk journey against the mock API
        run: scripts/check --all journeys
        working-directory: .
        env:
          VERIFY_ROOT: ${{ runner.temp }}/kiosk-verify
      - name: Upload journey evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiosk-journeys
          path: ${{ runner.temp }}/kiosk-verify/
          if-no-files-found: ignore

  # The device matrix runs beside the kiosk job: it takes about 3 minutes on its own.
  devices:
    name: devices
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Converge to the toolchain contract (docs/environments.md)
        working-directory: .
        # Installs Rust, Vite+, Node and Bun from the repo pins, puts them on PATH, then runs scripts/env/check.
        run: scripts/env/setup.sh --ci
      - run: node --version && bun --version && vp --version
      - name: Install kiosk dependencies and select its local CLI
        run: |
          vp install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/kiosk/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('kiosk/bun.lock') }}
      - name: Install Playwright Chromium for the device matrix
        run: vp exec playwright install --with-deps --only-shell chromium
      - name: Check every page on phone, tablet and desktop viewports
        run: scripts/check --all devices
        working-directory: .
        env:
          VERIFY_ROOT: ${{ runner.temp }}/kiosk-verify
      - name: Upload device matrix evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiosk-devices
          path: ${{ runner.temp }}/kiosk-verify/
          if-no-files-found: ignore

  scripts:
    name: scripts
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install script check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck sqlite3 zstd rsync python3-venv
      - run: scripts/check --all usage shell deploy env
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test encrypted off-site backups against loopback moto
        run: uvx --from 'moto[server]==5.2.4' --with 'pyrage==1.4.0' --with 'boto3==1.43.118' python -B deploy/backup/test-offsite.py

  client:
    name: client
    timeout-minutes: 5
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check shared Mac helpers offline
        run: |
          zsh -n client/factory.zsh
          python3 -B client/test_factory.py

  sandbox:
    name: sandbox
    # 24.04's AppArmor policy blocks unprivileged network namespaces. Do not disable it.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Converge to the sandbox toolchain contract (docs/environments.md)
        run: scripts/env/setup.sh --ci --env sandbox
      - name: Test host configuration installers in isolated namespaces
        run: python3 -B deploy/test-agent-host-config.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-
      - run: scripts/sandbox up --rows 1k
      - name: Check pricing refresh, confirmation and positive spend avoided
        run: python3 scripts/sandbox-shims/smoke.py
      - name: Sandbox logs
        if: failure()
        run: |
          for service in runtime seed meter factory-api; do scripts/sandbox logs "$service" || true; done
      - name: Stop sandbox
        if: always()
        run: scripts/sandbox down

  # The one check the auto-deployer reads: green only when every job above is.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, kiosk, devices, scripts, client, sandbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: test "$BAD" = false
        env:
          BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
