name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check (the release workflow supplies the verified tag commit)
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Pushes to main get one group per SHA: the release publisher needs successful
# CI for every first-parent main commit, so a later merge must not cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Rust and verify the C compiler
        run: |
          cc --version
          if [[ -f rust-toolchain || -f rust-toolchain.toml ]]; then
            rustup show active-toolchain
            rustup component add rustfmt clippy
          else
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install installer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sqlite3
      - run: bash meter/tests/installer-db.sh target/debug/meter

  kiosk:
    name: kiosk
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Converge to the toolchain contract (docs/environments.md)
        working-directory: .
        # Installs Rust, Vite+, Node and Bun from the repo pins, puts them on PATH, then runs scripts/env/check.
        run: |
          python3 -B scripts/env/test_check.py
          python3 -B scripts/env/test_setup.py
          scripts/env/setup.sh --ci
      - run: node --version && bun --version && vp --version
      - name: Install kiosk dependencies and select its local CLI
        run: |
          vp install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/kiosk/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp check
        env:
          OPENAPI_URL: file://${{ github.workspace }}/factory-api/openapi.json
      - run: vp test --run
      - run: vp build

  scripts:
    name: scripts
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/dispatch/.node-version
      - name: Test dispatcher, usage collector and ODD lifecycle
        run: node --test scripts/dispatch scripts/usage scripts/odd
      - name: Test immutable release fixtures and build metadata
        run: python3 scripts/release/test-release.py
      - name: Install script check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck sqlite3 zstd rsync
      - name: Check every deployment and version script
        run: |
          mapfile -d '' scripts < <(find deploy scripts -type f -name '*.sh' -print0)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck -x "${scripts[@]}"
      - name: Lint shared client helpers
        run: |
          shellcheck -s bash -x client/factory.zsh
          shellcheck -s bash -e SC2034 client/factory.env
      - name: Lint the installer and rollback contract
        run: |
          bash deploy/lint-installers.sh
          python3 -B deploy/test-lint-installers.py
      - run: python3 -B deploy/test_set_ollama_host.py
      - run: python3 -B deploy/test-install-dispatch.py
      - run: python3 -B deploy/backup/test-backup.py
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Test encrypted off-site backups against loopback moto
        run: uvx --from 'moto[server]==5.2.4' --with 'pyrage==1.4.0' --with 'boto3==1.43.118' python -B deploy/backup/test-offsite.py
      - run: python3 -B deploy/reboot/test-reboot.py
      - name: Test device installers
        run: |
          primary_group=$(id -gn)
          devices_test_group=$(id -Gn | tr ' ' '\n' | grep -vx "$primary_group" | head -n 1)
          test -n "$devices_test_group"
          echo "Using supplementary test group: $devices_test_group"
          DEVICES_TEST_GROUP="$devices_test_group" python3 -B deploy/devices/test-install.py
          python3 -B deploy/devices-agent/test-install.py

  client:
    name: client
    timeout-minutes: 5
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Check shared Mac helpers offline
        run: |
          zsh -n client/factory.zsh
          python3 -B client/test_factory.py

  sandbox:
    name: sandbox
    # 24.04's AppArmor policy blocks unprivileged network namespaces. Do not disable it.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Converge to the sandbox toolchain contract (docs/environments.md)
        run: scripts/env/setup.sh --ci --env sandbox
      - name: Test host configuration installers in isolated namespaces
        run: python3 -B deploy/test-agent-host-config.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain*') }}-
      - name: Check sandbox scripts
        run: |
          scripts=(scripts/sandbox scripts/sandbox-shims/nvidia-smi scripts/sandbox-shims/tailscale scripts/sandbox-shims/timedatectl scripts/sandbox-shims/ping)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck -x "${scripts[@]}"
      - run: scripts/sandbox up --rows 1k
      - name: Check pricing refresh, confirmation and positive spend avoided
        run: python3 scripts/sandbox-shims/smoke.py
      - name: Sandbox logs
        if: failure()
        run: |
          for service in runtime seed meter factory-api; do scripts/sandbox logs "$service" || true; done
      - name: Stop sandbox
        if: always()
        run: scripts/sandbox down
