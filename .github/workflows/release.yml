name: Release check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify (dry run; creates no release or artifacts)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag, version and main ancestry
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Tag must be v0.X.Y SemVer without leading zeroes'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git checkout --detach "$commit"
          [[ "$TAG" == "v$(cat VERSION)" ]] || { echo 'Tag must exactly match VERSION at the tagged commit'; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main || { echo 'Tagged commit is not in main history'; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    # Local workflow calls use the same commit as this workflow; GitHub does not accept a SHA suffix here.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}

  # PHASE 3 PLACEHOLDER: add versioned artifact and installer jobs after verify and ci.
  # This workflow deliberately never edits or deletes a release.
