name: Publish exact-SHA releases

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing tag to verify only; leave empty to reconcile
        required: false
        type: string

      resume_release:
        description: 'Optional existing release identity for recovery: vMAJOR.MINOR.PATCH=NUMERIC_ID'
        required: false
        type: string

      create_reserved_releases:
        description: 'Comma-separated reserved tags inspected by an owner and confirmed to have NO release (including hidden drafts)'
        required: false
        type: string

permissions: {}

# Events are hints, not a queue: every run reconciles first-parent history.
concurrency:
  group: immutable-release-publisher
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      has-plans: ${{ steps.bundles.outputs.has-plans }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned kiosk versions
        id: versions
        run: |
          node -e 'const p = require("./kiosk/package.json"); console.log("node=" + p.devEngines.runtime.version); console.log("pnpm=" + p.devEngines.packageManager.version)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Prepare build tools on the ephemeral runner
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          # Historical scripts/sandbox clears PATH to /usr/bin:/bin at runtime.
          # Match sandbox CI provisioning; GITHUB_PATH alone cannot reach it.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          env -i PATH=/usr/bin:/bin bwrap --unshare-net --ro-bind / / true
      - name: Plan and build or verify (read-only)
        id: bundles
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RESUME_RELEASE: ${{ inputs.resume_release }}
          CREATE_RESERVED_RELEASES: ${{ inputs.create_reserved_releases }}
        run: |
          resume_args=()
          if [[ -n "$CREATE_RESERVED_RELEASES" ]]; then
            [[ "$CREATE_RESERVED_RELEASES" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(,v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))*$ ]] || { echo 'Invalid reserved tags'; exit 1; }
            IFS=',' read -ra create_tags <<< "$CREATE_RESERVED_RELEASES"
            for tag in "${create_tags[@]}"; do resume_args+=(--create-reserved-release "$tag"); done
          fi
          if [[ -n "$RESUME_RELEASE" ]]; then
            [[ -z "$REQUESTED_TAG" ]] || { echo 'Choose verification or recovery, not both'; exit 1; }
            resume_args+=(--resume-release "$RESUME_RELEASE")
          fi
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ ${#resume_args[@]} -eq 0 ]] || { echo 'Choose verification or recovery, not both'; exit 1; }
            [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid tag'; exit 1; }
            sha=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}") || { echo 'tag not found'; exit 1; }
            git show "$sha:deploy/components.json" > "$RUNNER_TEMP/verify-inventory.json"
            python3 scripts/release/release.py verify --tag "$REQUESTED_TAG" --sha "$sha" --inventory "$RUNNER_TEMP/verify-inventory.json" --directory "$RUNNER_TEMP/verified"
          else
            python3 scripts/release/release.py build --directory "$RUNNER_TEMP/release-build" "${resume_args[@]}"
            if [[ -d "$RUNNER_TEMP/release-build/bundles" ]]; then
              echo 'has-plans=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bundles.outputs.has-plans == 'true'
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.has-plans == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      # Only trusted main release.py runs here. Never execute downloaded content,
      # install dependencies, or build in the job that holds the write credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build
      - name: Revalidate plans and publish verified bundles (never build or deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RELEASE: ${{ inputs.resume_release }}
          CREATE_RESERVED_RELEASES: ${{ inputs.create_reserved_releases }}
        run: |
          resume_args=()
          if [[ -n "$CREATE_RESERVED_RELEASES" ]]; then
            [[ "$CREATE_RESERVED_RELEASES" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(,v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))*$ ]] || { echo 'Invalid reserved tags'; exit 1; }
            IFS=',' read -ra create_tags <<< "$CREATE_RESERVED_RELEASES"
            for tag in "${create_tags[@]}"; do resume_args+=(--create-reserved-release "$tag"); done
          fi
          if [[ -n "$RESUME_RELEASE" ]]; then
            resume_args+=(--resume-release "$RESUME_RELEASE")
          fi
          python3 scripts/release/release.py publish --directory "$RUNNER_TEMP/release-build" "${resume_args[@]}"

