[[nodes]]
name = "factory-gpu"
services = [
  { name = "meter-http", kind = "http", target = "http://127.0.0.1:11434/meter/health" },
  { name = "ollama-http", kind = "http", target = "http://127.0.0.1:11435/api/version" },
  # Tailscale SSH does not answer this node's own port-22 connections.
  { name = "tailscaled", kind = "systemd", target = "tailscaled" },
  { name = "amp-runner", kind = "systemd", target = "amp-runner" },
  { name = "factory-api", kind = "http", target = "http://127.0.0.1:8080/v1/health" },
  { name = "kiosk-static", kind = "http", target = "http://127.0.0.1:8080/version.json" },
  { name = "backup-timer", kind = "systemd", target = "factory-backup.timer" },
  { name = "rdp", kind = "rdp", target = "factory-gpu:3389", interval_s = 300 },
]
[[nodes]]
name = "factory-console"
services = [
  { name = "rdp", kind = "rdp", target = "factory-console:3389", interval_s = 300 },
  # Reachability only: no remote systemd/Chrome/replica freshness claim.
  { name = "backup-replica-ssh", kind = "tcp", target = "factory-console:22" },
]
