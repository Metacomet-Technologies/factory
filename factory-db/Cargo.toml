[package]
name = "factory-db"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled", "trace"] }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
